name: p05-collection-preparation
on:
  push:
    paths:
      - 'projects/P05_test_dossier/pilot_r3/**'
      - '.github/workflows/p05-pilot.yml'
  pull_request:
    paths:
      - 'projects/P05_test_dossier/pilot_r3/**'
      - '.github/workflows/p05-pilot.yml'
permissions:
  contents: read
jobs:
  declaration-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify public source bytes
        run: python -B tools/verify_manifest.py
      - name: Exercise eight synthetic declaration gates
        run: python -B projects/P05_test_dossier/pilot_r3/tests/run_regressions.py --out p05-collection-evidence
      - name: Preserve synthetic regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p05-collection-${{ matrix.os }}
          path: p05-collection-evidence
          if-no-files-found: error
          retention-days: 14
